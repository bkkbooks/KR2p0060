body:
  text: 子見季桓子桓子曰斯聞之蓋賢者是能親仁親仁者是能行聖人之道如夫親仁行聖人之道則斯不足豈敢望之如夫見人不厭問禮不倦則斯中心樂之夫子曰上不親仁而附富聞其詞於逸人乎夫士品物不窮君子流其觀焉品物備矣而亡成德者也如此者焉與之處而察問其所學先由仁歟蓋君子聽之桓子曰如夫仁人之未察其行處可名而知歟夫子曰吾聞之唯仁人也有此貌也而無以合諸此矣雖非仁人也乃其物邪偽之民亦以其物審二道者以觀於民雖有過弗遠矣桓子曰二道者可得聞歟夫子曰言即至矣雖吾子勿問固將以告仁人之道衣服必中容貌不求異於人不也好睘隹聚仰天而歎曰不奉不味酒肉不食五穀擇處杆豈不難乎抑邪民之行也好美以爲此與仁人二者也夫邪偽之民其術多方如悉言之則恐久吾子桓子曰斯不佞吾子悉言之猶恐弗知況其如微言之乎夫子曰與邪偽之民衣服好皆求異於人衛興道學淫言不當其所皆同其此邪民也行年彌久聞教不察不依其行板反恭哀與豊兼此邪民也色不樸出言不忌見於君子大爲毋攝整此邪民也君子恒以衆福句拜四方之位以動君子之以其所窺之以其所欲知不行矣不兼絕以爲己兼此民爲信以事其上仁其如此也上唯道智亡不亂矣是故吾道之君子行冠弗見也語僉弗見也吾弗見也是察求之於中此以不惑而民道之仁援仁而進之不仁人弗得進矣始得不可人而與者君子而立師保慎其禮樂道其君子有道生民之化
